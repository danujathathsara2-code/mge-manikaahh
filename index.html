<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Happy Valentine’s Day mge manikaahh 🥺❤‍🩹🌍🥳🫀</title>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4, #fad0c4);
      color: #fff;
      text-align: center;
      overflow-x: hidden;
    }

    h1 {
      font-size: 2.8rem;
      margin-top: 90px;
      padding: 0 10px;
    }

    h2 {
      font-weight: 300;
      margin-top: 10px;
    }


    .section {
      padding: 60px 20px;
    }

    /* Gallery */
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 15px;
      max-width: 1000px;
      margin: auto;
    }

    .gallery img {
      width: 100%;
      border-radius: 18px;
      cursor: pointer;
      transition: transform 0.3s;
    }

    .gallery img:hover {
      transform: scale(1.06);
    }

    /* Audio */
    audio {
      margin-top: 20px;
      width: 300px;
    }

    /* Love Letter */
    .letter {
      max-width: 750px;
      margin: auto;
      background: rgba(255,255,255,0.85);
      padding: 35px;
      border-radius: 22px;
      font-size: 1.9rem;
      line-height: 1.6;
      color: #000;
      font-family: 'Great Vibes', cursive;
    }

    /* Hearts */
    .heart {
      position: fixed;
      bottom: -10px;
      color: rgba(255,255,255,0.8);
      font-size: 18px;
      animation: floatUp 6s linear infinite;
    }

    @keyframes floatUp {
      0% { transform: translateY(0); opacity: 1; }
      100% { transform: translateY(-100vh); opacity: 0; }
    }
    /* Fade-in animation */
.fade-in {
  opacity: 0;
  transform: translateY(20px);
  animation: fadeInUp 1.4s ease forwards;
}

@keyframes fadeInUp {
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* Typewriter effect */
.typewriter {
  white-space: pre-wrap; /* keeps line breaks */
  overflow: hidden;
}

    .counter {
  font-size: 1.6rem;
  background: rgba(255,255,255,0.15);
  display: inline-block;
  padding: 18px 30px;
  border-radius: 20px;
  margin-top: 15px;
  font-weight: 500;
}

.valentine-banner {
  background: rgba(255, 0, 100, 0.85);
  padding: 20px;
  margin: 20px auto;
  border-radius: 20px;
  width: 80%;
  font-size: 1.4rem;
}

/* Firework particles */
.firework {
  position: fixed;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  pointer-events: none;
  z-index: 9999;
  animation: explode 900ms ease-out forwards;
}

@keyframes explode {
  to {
    transform: translate(var(--dx), var(--dy)) scale(0.2);
    opacity: 0;
  }
}

/* Sparkle rain */
.sparkle {
  position: fixed;
  top: -10px;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: white;
  pointer-events: none;
  z-index: 9998;
  animation: sparkleFall linear forwards;
}

@keyframes sparkleFall {
  to {
    transform: translateY(110vh);
    opacity: 0;
  }
}

.music-button {
  position: fixed;
  bottom: 20px;
  right: 20px;
  background: rgba(255, 105, 180, 0.85);
  border: none;
  border-radius: 50%;
  width: 55px;
  height: 55px;
  font-size: 22px;
  color: white;
  cursor: pointer;
  box-shadow: 0 0 15px rgba(255, 105, 180, 0.6);
  transition: transform 0.2s ease;
  z-index: 9999;
}

.music-button:hover {
  transform: scale(1.1);
}


  </style>
</head>

<body>

  <!-- Background Music -->
   <audio id="bgMusic" loop>
     <source src="audio/back-music.mp3" type="audio/mpeg">
   </audio>

   <button id="musicBtn" class="music-button">🎵</button>

  <h1 style=color:black;>Happy Valentine’s Day mge manikaahh 🥺❤‍🩹🌍🥳🫀</h1>
  <h2>Forever yours, Sudu Mahaththya</h2>

 <div id="valentineMessage" class="valentine-banner" style="display:none;">
  💖 Happy Valentine’s Day my manikaahh 🥺❤‍🩹🌍  
  Thank you for 3 beautiful years of love.
 </div>



  <!-- Voice Message -->
  <div class="section">
    <h2>🎧 A message just for you</h2>
    <audio controls>
      <source src="audio/love-message.mp3" type="audio/mpeg">
    </audio>
  </div>

  <!-- Gallery -->
  <div class="section">
    <h2>📸 Our Beautiful Memories</h2>
    <div class="gallery">
      <img src="photos/img1.jpeg">
      <img src="photos/img2.jpeg">
      <img src="photos/img3.jpeg">
      <img src="photos/img4.jpeg">
      <img src="photos/img6.jpeg">
      <img src="photos/img7.jpeg">
      <img src="photos/img8.jpeg">
      <img src="photos/img9.jpeg">
      <img src="photos/img10.jpeg">
      <img src="photos/img11.jpeg">
      <img src="photos/img12.jpeg">
      <img src="photos/img13.jpeg">
      <img src="photos/img14.jpeg">
      <img src="photos/img15.jpeg">
      <img src="photos/img16.jpeg">
      <img src="photos/img17.jpeg">
      <img src="photos/img18.jpeg">
      <img src="photos/img19.jpeg">
    </div>
  </div>
<div class="section">
  <h2 style=color:darkred>🕰️ Our Time Together</h2>
  <div id="counter" class="counter"></div>
</div>

  <!-- Love Letter -->
  <div class="section">
    <h2>💌 From My Heart</h2>
    <div class="letter fade-in">
  <div id="typewriter" class="typewriter"></div>

      <!-- Paste the letter below -->
   

 <script>

const bgMusic = document.getElementById("bgMusic");

// Start at very low volume
bgMusic.volume = 0.05;

function startMusic() {
  bgMusic.play();

  // Fade in effect
  let volume = 0.05;
  const fadeInterval = setInterval(() => {
    if (volume < 0.25) {   // max volume (change if you want)
      volume += 0.01;
      bgMusic.volume = volume;
    } else {
      clearInterval(fadeInterval);
    }
  }, 200);

  document.removeEventListener("click", startMusic);
}

document.addEventListener("click", startMusic);

const musicBtn = document.getElementById("musicBtn");

musicBtn.addEventListener("click", function() {
  if (bgMusic.paused) {
    bgMusic.play();
    musicBtn.innerHTML = "⏸";
  } else {
    bgMusic.pause();
    musicBtn.innerHTML = "🎵";
  }
});

  // Floating hearts
  function createHeart() {
    const heart = document.createElement('div');
    heart.className = 'heart';
    heart.innerHTML = '❤️';
    heart.style.left = Math.random() * 100 + 'vw';
    heart.style.fontSize = (Math.random() * 20 + 10) + 'px';
    document.body.appendChild(heart);
    setTimeout(() => heart.remove(), 6000);
  }
  setInterval(createHeart, 250);

  // Typewriter letter
  const letterText = `Boleee,

You are my safest place, my favorite smile, my biggest blessing.
Every moment with you feels special, even the silent ones.
I don’t need the whole world — I just need you by my side.

No matter where life takes us, my heart will always choose you.
Thank you for loving me the way you do.

I love you endlessly, mage manikaahh 🥺❤‍🩹

— Danuu`;

  const el = document.getElementById("typewriter");
  let i = 0;

  function typeLetter() {
    if (i < letterText.length) {
      el.textContent += letterText.charAt(i);
      i++;
      setTimeout(typeLetter, 35); // typing speed (lower = faster)
    }
  }

  // Start typing after fade begins
  window.addEventListener("load", () => {
    setTimeout(typeLetter, 700);
  });

   // ❤️ Date Counter (Change this date)
const startDate = new Date("2022-11-20T00:00:00"); // YYYY-MM-DD

function updateCounter() {
  const now = new Date();
  const diff = now - startDate;

  const days = Math.floor(diff / (1000 * 60 * 60 * 24));
  const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
  const minutes = Math.floor((diff / (1000 * 60)) % 60);
  const seconds = Math.floor((diff / 1000) % 60);

  document.getElementById("counter").innerHTML =
    `${days} days • ${hours} hours • ${minutes} minutes • ${seconds} seconds 💕`;
}

setInterval(updateCounter, 1000);
updateCounter();

function miniFirework(x, y) {
  for (let i = 0; i < 30; i++) {
    const p = document.createElement("div");
    p.className = "firework";
    p.style.left = x + "px";
    p.style.top = y + "px";

    const angle = Math.random() * Math.PI * 2;
    const distance = 60 + Math.random() * 80;

    const dx = Math.cos(angle) * distance;
    const dy = Math.sin(angle) * distance;

    p.style.setProperty("--dx", dx + "px");
    p.style.setProperty("--dy", dy + "px");

    const colors = ["#ff4d6d", "#ffb703", "#ffffff", "#ff66c4"];
    p.style.background = colors[Math.floor(Math.random() * colors.length)];

    document.body.appendChild(p);
    setTimeout(() => p.remove(), 900);
  }
}

function sparkleRain(duration = 3000) {
  const interval = setInterval(() => {
    const s = document.createElement("div");
    s.className = "sparkle";

    s.style.left = Math.random() * 100 + "vw";
    s.style.animationDuration = (2 + Math.random() * 2) + "s";

    const colors = ["#ffffff", "#ffe6f2", "#ffd700"];
    s.style.background = colors[Math.floor(Math.random() * colors.length)];

    document.body.appendChild(s);

    setTimeout(() => s.remove(), 4000);
  }, 80);

  setTimeout(() => clearInterval(interval), duration);
}



const today = new Date();
if (today.getMonth() === 1 && today.getDate() === 14) {

  const banner = document.getElementById("valentineMessage");
  banner.style.display = "block";

  setTimeout(() => {
    const rect = banner.getBoundingClientRect();
    const centerX = rect.left + rect.width / 2;
    const centerY = rect.top + rect.height / 2;

    // 🎆 First burst
    miniFirework(centerX, centerY);

    // 🎆 Second burst (slightly delayed)
    setTimeout(() => {
      miniFirework(centerX + 40, centerY - 20);
    }, 400);

    // 🎆 Third burst
    setTimeout(() => {
      miniFirework(centerX - 40, centerY - 10);
    }, 800);

  }, 200);

  // ✨ Sparkle rain after fireworks
  setTimeout(() => {
  sparkleRain(6000);
  }, 1200);

}


</script>


</body>
</html>
